[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerr-geodesics-geometry"
version = "0.1.0"
description = "Kerr null-geodesic physics with optional static 3D viewer: v0.3A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.17"]

[project.optional-dependencies]
performance = ["numba>=0.67,<0.68"]
viewer = ["PySide6>=6.10.3,<6.12", "moderngl>=5.12,<6"]
viewer-performance = ["numba>=0.67,<0.68", "PySide6>=6.10.3,<6.12", "moderngl>=5.12,<6"]

[tool.setuptools.packages.find]
where = ["src"]
